# Render Blueprint for the free hosted demo: the web app as a static site
# (always on) and the API on a free web service (sleeps after 15 idle
# minutes; the app shows a waking-up screen meanwhile). The API runs in demo
# mode with an in-memory database, and every visitor gets a private copy of
# the demo data, so there's no database to pay for or look after.
#
# Render asks for the values marked sync: false when the Blueprint is
# created. See "Hosting the demo" in the README.
services:
  - type: web
    name: eventbuddy-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Download MongoDB into the project during the build, so it's there
      # at startup instead of being fetched on every wake
      - key: MONGOMS_DOWNLOAD_DIR
        value: /opt/render/project/src/server/.mongodb-binaries
      # Proxy hops in front of the app, so login limits see the visitor's
      # address. Erring high only matters to someone faking the header.
      - key: TRUST_PROXY
        value: "3"
      # The web app's address, e.g. https://eventbuddy.onrender.com
      - key: CLIENT_ORIGIN
        sync: false
      # Optional: Discover explains it's not set up without one
      - key: TICKETMASTER_API_KEY
        sync: false

  - type: web
    name: eventbuddy
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      # Client-side routing: every page is the app
      - type: rewrite
        source: /*
        destination: /index.html
    # Content Security Policy: the page runs only its own scripts, so even
    # if some text were turned into markup, it couldn't run code. It allows
    # what the app really loads: Google Fonts, map tiles, fonts and icons
    # from OpenFreeMap (fetched, and drawn by MapLibre in blob: workers),
    # photos from any https host (covers, Ticketmaster), and the API on
    # onrender.com. With a custom API address, put it in connect-src.
    # Checked against a real build with scripts/serve-build.js.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.onrender.com https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Keep the build's startup script in its own file rather than inline
      # in index.html, which the policy above would refuse
      - key: INLINE_RUNTIME_CHUNK
        value: "false"
      - key: REACT_APP_WAKE_SCREEN
        value: "true"
      # The API's address plus /api, e.g. https://eventbuddy-api.onrender.com/api
      - key: REACT_APP_API_URL
        sync: false
