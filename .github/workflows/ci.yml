name: CI

on:
  push:
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci installs exactly what package-lock.json lists and fails if it
      # is out of sync with package.json
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      # CI=true makes lint warnings fail the build
      - name: Build
        run: npm run build
